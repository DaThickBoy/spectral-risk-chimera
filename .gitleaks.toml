# gitleaks configuration (task 3.5; R24.1, R24.5). Uses the default rule set.
# Only generated or third-party content is excluded; source, tests, fixtures,
# and committed configuration are always scanned.
[extend]
useDefault = true

[allowlist]
description = "Generated and third-party content"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)\.git/''',
  '''(^|/)package-lock\.json$''',
  # Task 8.2, AT-SEC-23: the private key of a test-only, self-signed localhost
  # certificate that no system trusts. Exact path only; it is used solely by the
  # local HTTPS test server and never outside tests.
  '''^test/fixtures/tls/untrusted-localhost\.key\.pem$''',
]
